plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.bluehouse.enablevolte'
    compileSdk 36

    defaultConfig {
        applicationId "com.nirmala.pixel5gims"
        // Every Tensor Pixel (Pixel 6 and newer) launched on Android 12 / API 31 or later.
        minSdk 31
        targetSdk 36
        versionCode 26
        versionName "1.0.6"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep debug builds fast and fully reflective.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        aidl true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        // The redesigned English UI is intentionally shipped before the legacy translations.
        disable 'MissingTranslation'
    }
}

dependencies {
    // Single source of truth for every Compose artifact version.
    // 2025.10.00 maps to compose 1.9.3 / material3 1.4.0 — the versions already in use.
    def composeBom = platform('androidx.compose:compose-bom:2025.10.00')
    implementation composeBom
    debugImplementation composeBom

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.5'

    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    // R8 strips the unused icons from this artifact in release builds.
    implementation 'androidx.compose.material:material-icons-extended'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
    implementation "com.github.topjohnwu.libsu:core:6.0.0"
    implementation "com.github.topjohnwu.libsu:service:6.0.0"
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // Framework stubs only — must never be packaged into the APK.
    compileOnly 'com.anggrayudi:android-hidden-api:35.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    // RootVoWifiStatus and RegionalModemPatchStatus parse with org.json, which
    // Android provides at runtime but the JVM does not. This used to arrive
    // transitively through fuel-json; AGP's mockable android.jar supplies a
    // stub the JVM rejects with ClassFormatError, so depend on the real
    // implementation explicitly for tests. Not needed by the app or the APK.
    testImplementation 'org.json:json:20240303'
}
